name: Coleta diária

on:
  schedule:
    - cron: "7 13 * * *"   # 10h07 em Brasília (UTC−3): atualiza o retrato do dia
    - cron: "7 18 * * *"   # 15h07: idem
    - cron: "47 0 * * *"   # 21h47: retrato do fim do dia
    - cron: "47 2 * * *"   # 23h47: repescagem, só coleta se o dia ainda estiver sem coleta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Testes
        run: python3 -m unittest

      - name: Coletar
        env:
          AGENDA: ${{ github.event.schedule }}
        run: |
          if [ "$AGENDA" = "47 2 * * *" ]; then
            python3 -m coletor.coletar --se-faltar
          else
            python3 -m coletor.coletar
          fi

      # Hora e destino das saídas do acervo, para o painel. Uma falha aqui não perde a
      # coleta: a execução seguinte baixa de novo o dia anterior e o corrente.
      - name: Tramitações do dia
        continue-on-error: true
        run: python3 -m coletor.tramitacoes

      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Coleta de $(tail -n 1 dados/coletas.csv | cut -d, -f1)"
          git pull --rebase
          git push
