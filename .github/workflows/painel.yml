name: Painel

on:
  push:
    branches: [main]
  workflow_run:  # pushes do robô da coleta não disparam `push`
    workflows: ["Coleta diária"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: true

jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # no workflow_run, inclui o commit que a coleta acabou de gravar

      - name: Gerar os dados do painel
        run: python3 -m painel

      - name: Versionar CSS e JS
        run: sed -i "s/?v=dev/?v=$(git rev-parse --short HEAD)/g" site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
